name: ci
on: {push: {}, pull_request: {}}
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: cd backend && ./mvnw -B verify
      - run: cd backend && ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-project.sh
      - uses: aquasecurity/trivy-action@master
        with: {scan-type: fs, scan-ref: '.', severity: 'CRITICAL,HIGH', exit-code: '1'}
